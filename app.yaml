apiVersion: apps/v1
kind: Deployment
metadata:
  name: fact-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fact-app
  template:
    metadata:
      labels:
        app: fact-app
    spec:
      containers:
        - name: fact-app
          image: gawainn/fact-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fact-app-config
            - secretRef:
                name: fact-app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fact-app-service
spec:
  type: NodePort
  selector:
    app: fact-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080